name: Build Minimal TV
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android TV app
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/minimaltv app/src/main/res/drawable
          cat > settings.gradle <<'END'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'MinimalTV'
          include ':app'
          END
          cat > build.gradle <<'END'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          END
          cat > gradle.properties <<'END'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          END
          cat > app/build.gradle <<'END'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.minimaltv'
            compileSdk 35
            defaultConfig { applicationId 'com.minimaltv'; minSdk 23; targetSdk 28; versionCode 1; versionName '1.0' }
          }
          END
          cat > app/src/main/AndroidManifest.xml <<'END'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent>
              <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
            </queries>
            <application android:label="Minimal TV" android:theme="@android:style/Theme.Material.NoActionBar" android:banner="@drawable/banner">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="landscape">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.HOME"/><category android:name="android.intent.category.DEFAULT"/></intent-filter>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LEANBACK_LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          END
          cat > app/src/main/res/drawable/banner.xml <<'END'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#11131A"/></shape>
          END
          cat > app/src/main/java/com/minimaltv/MainActivity.java <<'END'
          package com.minimaltv;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.util.*;
          public class MainActivity extends Activity {
            int dp(int x) { return (int)(x*getResources().getDisplayMetrics().density+.5f); }
            TextView label(String s,int size,int color) { TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(color);return t; }
            GradientDrawable bg(int color,int outline) { GradientDrawable d=new GradientDrawable();d.setColor(color);d.setCornerRadius(dp(18));if(outline!=0)d.setStroke(dp(2),outline);return d; }
            @Override public void onCreate(Bundle b) { super.onCreate(b);
              getWindow().getDecorView().setSystemUiVisibility(5894);
              LinearLayout root=new LinearLayout(this);root.setOrientation(1);root.setPadding(dp(48),dp(32),dp(48),dp(24));root.setBackgroundColor(0xff101219);
              TextView title=label("MINIMAL  TV",22,Color.WHITE);title.setTypeface(null,Typeface.BOLD);root.addView(title);
              TextView hero=label("Your screen. Your choice.",36,Color.WHITE);hero.setTypeface(null,Typeface.BOLD);LinearLayout.LayoutParams hp=new LinearLayout.LayoutParams(-1,-2);hp.topMargin=dp(54);root.addView(hero,hp);
              TextView sub=label("A quieter home for everything you watch.",18,0xffa9b3c4);root.addView(sub);
              TextView apps=label("YOUR APPS",15,0xffb5c1d4);LinearLayout.LayoutParams ap=new LinearLayout.LayoutParams(-1,-2);ap.topMargin=dp(48);root.addView(apps,ap);
              HorizontalScrollView scroll=new HorizontalScrollView(this);scroll.setHorizontalScrollBarEnabled(false);LinearLayout row=new LinearLayout(this);row.setPadding(0,dp(20),0,dp(20));scroll.addView(row);root.addView(scroll);setContentView(root);
              PackageManager pm=getPackageManager();Intent q=new Intent(Intent.ACTION_MAIN);q.addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER);List<ResolveInfo> found=pm.queryIntentActivities(q,0);if(found.isEmpty()){q=new Intent(Intent.ACTION_MAIN);q.addCategory(Intent.CATEGORY_LAUNCHER);found=pm.queryIntentActivities(q,0);}
              Collections.sort(found,(a,c)->a.loadLabel(pm).toString().compareToIgnoreCase(c.loadLabel(pm).toString()));Set<String> seen=new HashSet<>();
              for(ResolveInfo r:found){String pkg=r.activityInfo.packageName;if(pkg.equals(getPackageName())||!seen.add(pkg))continue;
                LinearLayout tile=new LinearLayout(this);tile.setOrientation(1);tile.setGravity(Gravity.CENTER);tile.setFocusable(true);tile.setBackground(bg(0xff252b37,0));
                ImageView icon=new ImageView(this);icon.setImageDrawable(r.loadIcon(pm));tile.addView(icon,new LinearLayout.LayoutParams(dp(48),dp(48)));
                TextView name=label(r.loadLabel(pm).toString(),13,Color.WHITE);name.setGravity(Gravity.CENTER);name.setSingleLine(true);name.setEllipsize(android.text.TextUtils.TruncateAt.END);LinearLayout.LayoutParams np=new LinearLayout.LayoutParams(dp(110),-2);np.topMargin=dp(10);tile.addView(name,np);
                tile.setOnFocusChangeListener((v,f)->{v.setBackground(bg(f?0xff344760:0xff252b37,f?0xffa4bfff:0));v.setScaleX(f?1.05f:1);v.setScaleY(f?1.05f:1);});
                tile.setOnClickListener(v->{Intent launch=pm.getLeanbackLaunchIntentForPackage(pkg);if(launch==null)launch=pm.getLaunchIntentForPackage(pkg);if(launch!=null)startActivity(launch);});
                LinearLayout.LayoutParams tp=new LinearLayout.LayoutParams(dp(145),dp(125));tp.rightMargin=dp(14);row.addView(tile,tp);
              }
            }
          }
          END
      - name: Compile APK
        run: gradle assembleDebug --no-daemon
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
